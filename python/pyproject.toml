[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stepmeld"
version = "0.1.0"
description = "stepmeld for Python: the contracts' schemas as data, and the verb protocol a program speaks to the local Performer (read request.json, write progress.json and outcome.json)."
license = "MIT OR Apache-2.0"
authors = [{ name = "VEO Labs LLC" }]
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.21", # MIT
]

[project.urls]
Repository = "https://github.com/veolabs-llc/stepmeld"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/stepmeld"]

[tool.pytest.ini_options]
testpaths = ["tests"]
