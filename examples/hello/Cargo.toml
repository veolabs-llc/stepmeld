[package]
name = "stepmeld-example-hello"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The README's walkthrough: one program doing the work of two StepDefinitions, stepdef_add and stepdef_multiply"
# an example, never published
publish = false

[[bin]]
name = "hello-program"
path = "src/main.rs"

# Nothing of stepmeld: the program speaks the run directory protocol
# (contracts/run-directory.v1.md) itself, and needs only JSON.
[dependencies]
serde_json.workspace = true

# tests only (never in the program): the files it writes are held to the contracts
[dev-dependencies]
tempfile = "3"
stepmeld-core = { path = "../../stepmeld-core" }
