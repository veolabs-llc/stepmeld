[workspace]
resolver = "2"
members = ["stepmeld-core", "stepmeld-sqlite", "stepmeld-local", "stepmeld-cli", "stepmeld-verb"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/veolabs-llc/stepmeld"
readme = "README.md"
keywords = ["workflow", "engine", "pipeline"]
categories = ["development-tools"]

[workspace.dependencies]
# Ours, by path here and by version once published.
stepmeld-core = { path = "stepmeld-core", version = "0.1.0" }
stepmeld-sqlite = { path = "stepmeld-sqlite", version = "0.1.0" }
stepmeld-local = { path = "stepmeld-local", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
# float_roundtrip: a Value is opaque and must come back byte-for-byte
serde_json = { version = "1", features = ["float_roundtrip"] }
# Holding a document to its contract (MIT; no default features: no
# network or file resolvers, the schemas are compiled in).
jsonschema = { version = "0.58", default-features = false }
