# Nightly, on a self-hosted runner. Not a gate (CLAUDE.md, "Tests"):
# nothing waits on this. Every suite from a fresh checkout; one issue is
# opened when something fails. `workflow_dispatch` runs it on demand.
#
# This repository is public and the runner is a machine of ours: this
# file runs only from main (schedule/dispatch), never on pull requests,
# so a fork's branch never executes there.

name: nightly

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  suites:
    name: every suite, fresh checkout
    runs-on: [self-hosted, linux]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: scripts/test.sh

  report:
    needs: [suites]
    if: always() && needs.suites.result != 'success'
    runs-on: [self-hosted, linux]
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        env:
          SUITES: ${{ needs.suites.result }}
        with:
          script: |
            const title = "Nightly tests failed";
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${new Date().toISOString().slice(0, 10)}: suites **${process.env.SUITES}** — ${run}`;
            const open = await github.rest.issues.listForRepo({
              ...context.repo, state: "open", labels: "nightly", per_page: 1 });
            const hit = open.data.find(i => i.title === title);
            if (hit) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: hit.number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ["nightly"] });
            }
